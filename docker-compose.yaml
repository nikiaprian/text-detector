networks:
  net-myexams:
    name: net-myexams
    external: true
  net-myexams6:
    name: net-myexams6
    external: true

volumes:
  vol-redis-db:
    name: vol-redis-db-cbtmadrasahbatam

services:
  redis-db-cbtmadrasahbatam:
      container_name: redis-db-cbtmadrasahbatam
      image: redis:7.2.5
      restart: always
      networks:
        - net-myexams
        - net-myexams6
      volumes:
        - vol-redis-db:/data
  myexams-cbtmadrasahbatam:
    container_name: myexams-cbtmadrasahbatam
    image: registry.myexams.web.id/myexams:1.20.9-origin
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.7'
          memory: '1G'
    networks:
      - net-myexams
      - net-myexams6
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.myexams-cbtmadrasahbatam.rule=Host(`cbtmadrasahbatam.com`)"
      - "traefik.http.routers.myexams-cbtmadrasahbatam.entrypoints=websecure"
      - "traefik.http.routers.myexams-cbtmadrasahbatam.tls.certresolver=resolver"
      - "traefik.http.services.myexams-cbtmadrasahbatam.loadbalancer.server.port=80"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis-db-cbtmadrasahbatam
    external_links:
      - mongo-db6:mongo-db-service
    environment:
      - PORT=8000 # Don't change default port
      - NUMBER_OF_WORKER=1
      # Zona waktu: [Asia/Jakarta|Asia/Makasar|Asia/Jayapura]
      - TZ=Asia/Jakartaa
      # Scret key berfungi sebagai kunci dari segala bentuk autentikasi.
      - JWT_SECRET_KEY=SI6ImRldiIaasdfsdfsImasasd324234asdasfasdasdffsasdfdfOasdfHoiZGV2QGdtYWlaasfssaaewrLmNvasdfasdfbS
      # Backdoor account.
      - BACKDOOR_USER_NAME=MyExams8381*
      - BACKDOOR_USER_PASSWORD=MyExams8381*
      # Konfigurasi database.
      - REDIS_CONNECTION=redis://redis-db-cbtmadrasahbatam:6379/0
      - MONGO_CONNECTION=mongodb://mongo-db-service:27017/cbtmadrasahbatam
      # - MONGO_CONNECTION=mongodb://user:pass@<host>:27017/cbtmadrasahbatam?authMechanism=DEFAULT